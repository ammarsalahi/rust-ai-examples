[package]
name = "sentiment-analysis"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"

tokenizers = "0.22"
hf-hub = { version = "0.4", features = ["ureq"] }
